[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-gateway"
version = "1.0.0"
description = "Local LLM gateway with unified messages API"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "pydantic-settings>=2.6,<3",
    "uvicorn[standard]>=0.32,<1",
    "structlog>=24,<26",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.24", "anyio>=4"]

[project.scripts]
remote-gateway = "remote_gateway.cli:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.setuptools.packages.find]
include = ["remote_gateway*"]
